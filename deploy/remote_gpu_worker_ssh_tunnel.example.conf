# GPU-side OpenSSH client fragment. This is a template only; do not run it
# until the ECS tunnel account, host key and forwarding policy are separately
# approved and verified.

Host epilocate-control-plane-tunnel
    HostName ECS_TUNNEL_HOST_REPLACE_ME
    Port 22
    User epilocate-gpu-tunnel
    IdentityFile /mnt/epilocate/ssh/gpu-tunnel_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    UserKnownHostsFile /mnt/epilocate/ssh/known_hosts
    BatchMode yes
    RequestTTY no
    ExitOnForwardFailure yes
    ServerAliveInterval 15
    ServerAliveCountMax 3
    ConnectTimeout 10
    ClearAllForwardings yes
    LocalForward 127.0.0.1:9443 127.0.0.1:9443
    LocalForward 127.0.0.1:9444 127.0.0.1:9444
