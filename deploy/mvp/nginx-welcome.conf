# Include inside the existing project.xbstu.com HTTPS server block only after
# the Welcome candidate has passed the release gate. The Review root stays intact.
location = /welcome {
    return 302 /welcome/;
}

location ^~ /welcome/ {
    root /var/www/epilocate-mvp;
    try_files $uri $uri/ /welcome/index.html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://images.higgs.ai https://d8j0ntlcm91z4.cloudfront.net; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; font-src 'self' https://db.onlinewebfonts.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://db.onlinewebfonts.com https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
