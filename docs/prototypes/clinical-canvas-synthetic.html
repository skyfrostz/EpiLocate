function casePage(){let list=cases().filter(c=>c.id.toLowerCase().includes(state.search.toLowerCase()));if(state.filter==='active')list=list.filter(c=>['running','queued'].includes(c.analysis));if(state.filter==='completed')list=list.filter(c=>c.analysis==='completed');if(state.filter==='attention')list=list.filter(c=>c.analysis==='failed'||c.input==='EXPIRED');if(state.filter==='created')list=list.filter(c=>c.input==='CREATED');return heading('病例中心','以病例组织输入、任务和结果。',newButton())+notice()+`<section class="panel"><div class="toolbar"><label class="input-wrap">${icon('search')}<input id="caseSearch" type="search" placeholder="筛选已加载病例…" value="${escapeHTML(state.search)}" aria-label="筛选已加载病例"></label><select class="select" id="caseFilter" aria-label="筛选病例状态">${[['all','全部已加载病例'],['active','分析中 / 排队'],['completed','分析已完成'],['attention','需要关注'],['created','待上传']].map(([v,t])=>`<option value="${v}" ${state.filter===v?'selected':''}>${t}</option>`).join('')}</select><button class="btn small-btn" data-action="clear-filter">清除筛选</button><span class="grow"></span><button class="icon-button" data-action="density" aria-label="切换列表密度" title="切换列表密度">${icon('task')}</button><button class="icon-button" data-action="refresh" aria-label="刷新病例">${icon('refresh')}</button></div>${list.length?caseTable(list):empty(state.search||state.filter!=='all'?'没有匹配的病例':'还没有病例',state.search||state.filter!=='all'?'试着清除筛选条件；当前搜索只覆盖已加载记录。':'准备一个匿名单切片病例开始使用。')}<div class="table-footer"><span>当前筛选 ${list.length} 个 / 已加载 ${cases().length} 个 · 示例数据</span><span>生产使用游标分页，不把当前页当作总量</span></div></section>`}
function workPage(id,resultMode=false){const c=caseById(id);if(!c)return missingCase();const ready=c.input==='READY';const done=c.analysis==='completed'||c.analysis==='prediction';return heading(resultMode?'分析结果':'病例工作区',`${c.id} · 合成几何切片 · 示例病例`, `<button class="btn" data-page="cases">${icon('back')}病例中心</button>`)+`<div class="context-strip"><span>输入 ${badge(...inputStatus(c.input))}</span><span>分析 ${analysisBadge(c)}</span><span>显示范围 <strong>1 张切片</strong></span><span class="grow"></span><button class="text-button" data-action="copy-id" data-id="${c.id}">${icon('copy')}复制示例ID</button></div>${c.input==='EXPIRED'?`<div class="notice warning">${icon('clock')}输入已到期。生产系统应停止读取 DICOM，但仍保留历史任务与结果记录。</div>`:''}<section class="workspace"><div class="workspace-top"><div class="tools"><button class="tool active" data-action="pointer" title="平移工具（原型占位）" aria-label="平移工具示意">${icon('move')}<span>平移</span></button><button class="tool" data-action="zoom-in" aria-label="放大几何测试图">${icon('zoom')}<span>放大</span></button><button class="tool" data-action="zoom-out" aria-label="缩小几何测试图">−</button><span class="tool-divider"></span><button class="tool" data-action="reset-view" aria-label="重置视图">${icon('reset')}重置</button></div><span class="small muted">${resultMode?'结果阅读':'输入检查'} · 几何示意，不是临床CT</span></div><div class="workspace-grid"><aside class="study-side"><h3>当前影像</h3><div class="series-tile"><div class="series-thumb">${phantom('thumb')}</div><p>CT · 单切片</p><small>研究输入 · 1 / 1</small></div><p class="study-note">本原型使用原创几何图。生产版复用现有 Cornerstone Viewer。</p></aside><div class="viewport ${state.overlay&&done&&ready?'show-overlay':''}" id="viewport" style="--zoom:${state.zoom};--overlay-opacity:${state.opacity/100}"><div class="viewport-identity"><strong>${c.id}</strong><br>GEOMETRY PHANTOM<br>DEMO / NOT CLINICAL</div><div class="viewport-format">SINGLE IMAGE<br>1 / 1<br>示意</div>${c.input==='CREATED'?`<div class="empty" style="color:#bac7d9"><div class="empty-symbol" style="background:#1c2937;border-color:#364455">${icon('upload')}</div><h3>等待影像输入</h3><p style="color:#a2b1c4">先准备去标识 DICOM，再发起分析。</p><button class="btn" data-action="add-input" data-id="${c.id}">使用示例输入</button></div>`:c.input==='EXPIRED'?`<div class="empty"><h3>原始输入已到期</h3><p style="color:#a2b1c4">重新取得输入须遵循现有业务流程。</p></div>`:phantom()}${ready?'<span class="viewport-label">几何测试图 · 非真实 CT · 非病灶真值</span>':''}<div class="viewport-bottom"><span>ZOOM <b id="zoomValue">${Math.round(state.zoom*100)}%</b></span><span>原型不执行医学图像处理</span></div></div><aside class="analysis-side"><div class="analysis-section"><h3>分析工作</h3>${analysisBadge(c)}<p class="inline-note" style="margin:10px 0 12px">${done?'结果仅在当前病例上下文中阅读，不在概览显示概率。':c.analysis==='running'?'任务正在运行。真实进度由服务端确认。':'输入准备完成后，可发起分类与遮挡任务。'}</p>${c.task?`<button class="btn small-btn" style="width:100%" data-page="task" data-id="${c.id}">查看任务${icon('arrow')}</button>`:`<button class="btn small-btn primary" style="width:100%" data-action="request-analysis" data-id="${c.id}" ${!ready?'disabled':''}>发起示例分析</button>`}</div><div class="analysis-section"><h3>响应图层</h3><div class="tabs" role="group" aria-label="遮挡尺度">${[16,32,64].map(s=>`<button class="${state.scale===s?'active':''}" data-action="scale" data-value="${s}" aria-pressed="${state.scale===s}" ${!done?'disabled':''}>${s} px</button>`).join('')}</div>${[['response','响应图'],['candidate','候选响应区'],['comparison','尺度比较']].map(([k,label])=>`<button class="layer-button ${state.layer===k?'active':''}" data-action="layer" data-value="${k}" aria-pressed="${state.layer===k}" ${!done?'disabled':''}>${icon('layers')}<span>${label}</span></button>`).join('')}<label class="toggle-row" for="overlayToggle"><span>显示叠加</span><input id="overlayToggle" type="checkbox" ${state.overlay?'checked':''} ${!done||!ready?'disabled':''}></label><div class="toggle-row"><span>透明度</span><span id="opacityValue">${state.opacity}%</span></div><input id="opacity" class="range" type="range" min="0" max="100" step="5" value="${state.opacity}" aria-label="叠加透明度" ${!done?'disabled':''}><div class="mini-legend"><span>低响应</span><span class="legend-grad"></span><span>高响应</span></div></div><div class="analysis-section"><h3>模型输出</h3><div class="kv"><span>分类结果</span><strong>仅接入后显示</strong></div><div class="kv"><span>模型</span><strong>FrozenBaseline</strong></div><div class="kv"><span>解释范围</span><strong>2D 单切片</strong></div><p class="inline-note" style="font-size:10px;margin-top:12px">本原型不伪造诊断和分类概率。实际结果来自受保护 Result API。</p></div></aside></div><div class="workspace-foot"><span>模型响应 ≠ 病灶标注 · 仅研究用途</span><span>${state.scale} px · ${state.layer==='comparison'?'14×14 比较图仅显示放大':'几何契约通过后才允许生产叠加'}</span></div></section><details class="meta-details"><summary>来源与验证边界</summary><p class="inline-note" style="padding:12px 0">生产实现必须保留 DICOM SHA-256、provenance、Slice、版本和几何校验。本原型使用原创几何图，并未运行真实 Cornerstone、分类模型或遮挡推理。</p></details><p class="inline-note research-mobile-note" style="display:none;margin-top:14px">小屏适合查看任务。精细影像阅读建议使用桌面显示器。</p>`}
function taskList(){const list=cases().filter(c=>c.task&&(state.taskFilter==='all'||c.analysis===state.taskFilter));return heading('任务记录','追踪分析的执行过程，不在这里解释诊断。',`<button class="btn" data-action="refresh">${icon('refresh')}刷新</button>`)+`<div class="notice">${icon('help')}<span>${state.capability==='current'?'当前契约模式：此列表只代表当前会话已知任务，尚无全局任务列表API。':'目标能力示例：授权的服务端任务分页聚合。所有记录仍为离线示例。'}</span></div><section class="panel"><div class="toolbar"><div class="tabs" aria-label="任务状态筛选">${[['all','全部'],['running','分析中'],['queued','排队'],['completed','已完成'],['failed','未完成']].map(([v,label])=>`<button class="${state.taskFilter===v?'active':''}" data-action="task-filter" data-value="${v}">${label}</button>`).join('')}</div></div>${list.length?`<div class="table-scroll"><table aria-label="示例任务记录"><thead><tr><th>任务 / 病例</th><th>类型</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>${list.map(c=>`<tr><td><a class="case-name" href="#/task/${c.id}"><span class="case-icon">${icon('task')}</span><span>${c.task}<small>${c.id}</small></span></a></td><td>遮挡 / 分类示例</td><td>${analysisBadge(c)}</td><td class="muted">${c.time}</td><td><button class="text-button" data-page="task" data-id="${c.id}">查看${icon('chevron')}</button></td></tr>`).join('')}</tbody></table></div>`:empty('没有匹配的已知任务','任务列表范围受当前接口能力限制。')}<div class="table-footer"><span>${list.length} 条示例记录</span><span>不提供不存在的暂停 / 取消接口</span></div></section>`}
function taskDetail(id){const c=caseById(id);if(!c)return missingCase();const failed=c.analysis==='failed',complete=['completed','prediction'].includes(c.analysis);const steps=[['任务建立','已确认任务ID'],['进入队列','等待可用计算资源'],['模型处理','GPU执行信息由服务端返回'],[failed?'分析未完成':complete?'结果已生成':'等待结果',failed?'安全错误类型：INFERENCE_FAILED':'保留输入、任务与结果的关联']];return heading('任务详情',`${c.task||'SYNTH-NEW-TASK'} · ${c.id}`,`<button class="btn" data-page="case" data-id="${c.id}">${icon('back')}返回病例</button>`)+`<div class="details-layout"><section class="panel"><div class="task-summary ${failed?'failed':''}"><div class="summary-icon">${icon(failed?'alert':complete?'check':'clock')}</div><div><h2>${status(c.analysis)[0]}</h2><p class="panel-sub">${failed?'保留失败记录，重新发起会创建一个新任务。':complete?'任务已完成，可在病例上下文中阅读结果。':'正在处理，无需重复提交相同任务。'}</p></div></div><div class="panel-body" style="padding-top:10px"><div class="timeline">${steps.map(([t,d],i)=>`<div class="timeline-item"><span class="timeline-point ${i<3||complete?'done':'current'}">${i<3||complete?'✓':i+1}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div>${failed?`<div class="notice error">${icon('alert')}<span>分析未能完成。请核对输入格式与计算服务后再试。不会向用户暴露服务端 traceback 或私有路径。</span></div><div class="flex"><button class="btn" data-action="refresh">${icon('refresh')}重试读取状态</button><button class="btn primary" data-action="retry" data-id="${c.id}">重新发起分析${icon('arrow')}</button></div>`:complete?`<button class="btn primary" data-page="result" data-id="${c.id}">查看分析结果${icon('arrow')}</button>`:`<div class="bar" style="height:7px"><span style="width:${c.analysis==='running'?'62':'0'}%"></span></div><p class="inline-note">${c.analysis==='running'?'62% · 示例进度。真实 progress 为空时仅显示处理阶段。':'排队时不提供虚构的进度与完成时间。'}</p>`}${historyPanel(c)}</div></section><div class="stack"><section class="panel"><div class="panel-head"><h2>任务信息</h2>${badge('示例')}</div><div class="panel-body"><div class="kv"><span>病例</span><a href="#/case/${c.id}">${c.id}</a></div><div class="kv"><span>任务类型</span><strong>OCCLUSION</strong></div><div class="kv"><span>模型</span><strong>FrozenBaseline</strong></div><div class="kv"><span>来源</span><strong>离线示例</strong></div><div class="kv"><span>尝试次数</span><strong>1</strong></div></div></section><section class="panel"><div class="panel-head"><h2>处理建议</h2></div><div class="panel-body"><p class="inline-note">“重试读取”仅查询状态。“重新发起分析”才创建新任务；必须防止重复提交并保留旧任务证据。</p></div></section></div></div>`}
function systemPage(){const target=state.capability==='target',admin=state.role==='admin';return heading('系统状态','将业务可用性与底层硬件状态分开。',`<button class="btn" data-action="refresh">${icon('refresh')}重新检查</button>`)+`<div class="notice">${icon('shield')}<span>${admin?'管理员视角仅用于原型预览。生产权限必须由后端提供 capabilities，不能由用户名判断。':'医生视角提供简明服务可用性。详细遥测仅在获得服务端授权后显示。'}</span></div><div class="system-grid">${[['Gateway','network','登录与会话'],['Backend','system','病例与任务接口'],['GPU','cpu','计算硬件'],['Worker','task','业务执行进程']].map(([name,ic,desc])=>{const integrated=target||['Gateway','Backend'].includes(name);return `<section class="panel system-card"><div class="system-card-top"><span class="avatar">${icon(ic)}</span><div class="grow"><h2>${name}</h2><span class="small muted">${desc}</span></div>${badge(integrated?'可用 · 示例':'未接入',integrated?'success':'neutral')}</div><div class="service-drawing"><span class="service-node">${name==='GPU'||name==='Worker'?'受控遥测':'浏览器请求'}</span><span class="status-dash"></span><span class="service-node">${integrated?'示例服务':'未知来源'}</span><span class="status-dash"></span><span class="service-node">${integrated?'已采样':'待接入'}</span></div><div class="kv"><span>数据来源</span><strong>${target?'目标接口 · 示例':'当前接口能力演示'}</strong></div><div class="kv"><span>最后更新</span><strong>${integrated?'当前模拟时刻 · 示例':'—'}</strong></div>${admin?`<div class="kv"><span>${name==='GPU'?'硬件型号':'详细状态'}</span><strong>${name==='GPU'&&target?'模拟加速器':'需要正式授权遥测'}</strong></div>`:''}<p class="inline-note" style="margin-top:16px">${name==='GPU'?'硬件有负载不等于业务 Worker 可领取任务。研究训练与在线推理不得混为一谈。':name==='Worker'?'未接入不是离线；心跳、队列和领取能力必须来自当前业务服务。':'一次 API 请求成功只能证明该接口可达，不证明所有依赖正常。'}</p></section>`}).join('')}</div>`}
function prefs(){return heading('显示偏好','仅影响本次打开的界面，不改变研究配置或访问权限。')+`<section class="panel settings-card"><div class="setting"><div><h3>外观</h3><p>影像画布始终保持深色，避免影响阅读。</p></div><div class="tabs" aria-label="选择主题">${[['light','浅色'],['dark','深色'],['system','跟随系统']].map(([v,t])=>`<button class="${state.theme===v?'active':''}" data-action="set-theme" data-value="${v}" aria-pressed="${state.theme===v}">${t}</button>`).join('')}</div></div><div class="setting"><div><h3>信息密度</h3><p>紧凑适合桌面列表；舒适适合触控。</p></div><div class="tabs" aria-label="选择信息密度">${[['compact','紧凑'],['standard','标准'],['comfortable','舒适']].map(([v,t])=>`<button class="${state.density===v?'active':''}" data-action="set-density" data-value="${v}" aria-pressed="${state.density===v}">${t}</button>`).join('')}</div></div><div class="setting"><div><h3>减少动效</h3><p>同时遵循操作系统的减少动效设置。</p></div><label class="flex small"><input type="checkbox" id="reduceMotion" ${state.reduced?'checked':''}>减少界面过渡</label></div><div class="setting"><div><h3>隐私范围</h3><p>本原型仅保存外观偏好，不保存病例、账号、密码或令牌。</p></div>${badge('本地偏好')}</div><div class="setting"><div><h3>产品欢迎页</h3><p>独立入口，与病例工作系统保持清楚边界。</p></div><button class="btn" data-page="welcome">查看欢迎页提案${icon('arrow')}</button></div></section>`}
function loginPage(){return `<main id="main" class="login-wrap"><section class="login-art">${brand()}<div><div class="eyebrow">EPILOCATE / RESEARCH WORKSPACE</div><h1>让影像工作，<br>回到清晰。</h1><p>从病例输入到模型响应，在同一个工作区中有序查看。专业工具退后一步，让影像与工作本身更清楚。</p><div class="login-shape">${art()}</div></div><span class="small muted">研究用途 · 不是临床诊断系统</span></section><section class="login-form"><div class="login-form-inner"><div class="eyebrow">WORKSPACE ACCESS</div><h1>登录工作区</h1><p>这是无需真实账号的离线交互原型。</p><form id="loginForm"><label class="field" for="demoName">示例账号<input id="demoName" value="SYNTH-VIEWER" autocomplete="off" readonly aria-describedby="demoLoginNote"></label><label class="field" for="demoSecret">状态<input id="demoSecret" value="合成会话，无需凭据" type="text" readonly autocomplete="off"></label><button class="btn primary" type="submit">进入原型${icon('arrow')}</button></form><p id="demoLoginNote" class="inline-note">不要在本原型输入真实密码。生产版保持现有登录、CSRF、next 跳转与跨标签会话逻辑。</p><button class="text-button" data-page="welcome">${icon('back')}返回欢迎页</button></div></section></main>`}
function welcomePage(){return `<main id="main" class="welcome"><header class="welcome-header">${brand()}<span class="tag-label">Welcome 视觉衔接提案 · 非线上替换</span><button class="btn" data-page="login">进入系统${icon('arrow')}</button></header><div class="welcome-body"><div><div class="eyebrow">MEDICAL IMAGING / RESEARCH</div><h1>以影像为中心。<br>让研究有据可循。</h1><p>EpiLocate 将病例输入、分析任务与模型响应组织在同一工作空间，让每一步都清楚、可追溯。</p><button class="btn primary" style="min-height:43px;padding:10px 18px" data-page="login">进入 EpiLocate 工作区${icon('arrow')}</button><p class="inline-note" style="font-size:11px;margin-top:15px">仅供研究，模型响应不等于病灶标注或诊断。</p></div><div class="welcome-board"><div class="flex between"><strong>工作概览</strong>${badge('设计示例')}</div><div class="welcome-board-grid"><div class="welcome-mini" style="grid-row:span 2"><div style="height:150px;display:grid;place-items:center">${art()}</div><strong>病例与影像</strong><span>统一上下文，清楚地继续工作。</span></div><div class="welcome-mini"><strong>分析进度</strong><div class="bar"><span style="width:64%"></span></div><span>状态可见，不重复提交。</span></div><div class="welcome-mini"><strong>结果与证据</strong><span>在病例上下文中阅读模型响应。</span></div></div></div></div><div class="welcome-bottom"><span>合成几何切片 工作流</span><span>受保护的结果访问</span><span>模型解释与证据边界</span><span>模拟导航 · 欢迎页 → 工作区</span></div></main>`}
function render(){applyPrefs();const r=route();document.title=`${titleFor(r.name)} · EpiLocate Clinical Canvas`;if(r.name==='login'||r.name==='welcome'){document.querySelector('#app').innerHTML=r.name==='login'?loginPage():welcomePage();return}document.querySelector('#app').innerHTML=shell();document.querySelector('#main').innerHTML=({overview:dashboard,cases:casePage,tasks:taskList,system:systemPage,preferences:prefs,case:()=>workPage(decodeId(r.id||state.selected)),result:()=>workPage(decodeId(r.id||state.selected),true),task:()=>taskDetail(decodeId(r.id||state.selected))}[r.name]||dashboard)();}
function toast(msg){const e=document.querySelector('#toast');clearTimeout(toastTimer);e.textContent=msg;e.classList.add('visible');toastTimer=setTimeout(()=>e.classList.remove('visible'),3600)}
function showDialog(id){lastFocus=document.activeElement;document.getElementById(id).showModal();if(id==='command'){document.getElementById('commandQuery').value='';renderCommands('');document.getElementById('commandQuery').focus()}}
function closeDialog(id){document.getElementById(id).close();lastFocus?.focus?.()}
function closeNavigation(){const m=document.querySelector('.main-shell');if(m)m.inert=false;document.getElementById('sidebar')?.classList.remove('open');document.getElementById('scrim')?.classList.remove('visible')}
function renderCommands(q){const items=[...routes,['welcome','globe','欢迎页'],['login','logout','登录页'],['new','plus','新建病例']].filter(a=>a[2].includes(q)||a[0].includes(q.toLowerCase()));document.getElementById('commandList').innerHTML=items.length?items.map(([n,i,t])=>`<button data-action="command-go" data-page="${n}">${icon(i)}<span>${t}</span><small>跳转</small></button>`).join(''):'<p class="muted small" style="padding:18px">没有匹配项</p>'}
function updateViewport(){const el=document.querySelector('#viewport');if(!el)return;el.style.setProperty('--zoom',state.zoom);el.style.setProperty('--overlay-opacity',state.opacity/100);el.classList.toggle('show-overlay',state.overlay);const zoom=document.querySelector('#zoomValue');if(zoom)zoom.textContent=Math.round(state.zoom*100)+'%'}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(a==='command-go'){closeDialog('command');if(b.dataset.page==='new'){showDialog('create')}else go(b.dataset.page);return}if(b.dataset.page&&!a){go(b.dataset.page,id);return}switch(a){case'create':state.fixture=false;document.getElementById('createConfirm').disabled=true;document.getElementById('caseNote').value='合成几何切片';document.getElementById('uploadTitle').textContent='准备单切片 DICOM';document.getElementById('uploadSubtitle').textContent='生产环境需使用已去标识影像，并由后端再次校验。';showDialog('create');break;case'select-fixture':state.fixture=true;document.getElementById('createConfirm').disabled=false;document.getElementById('uploadTitle').textContent='示例输入已选择';document.getElementById('uploadSubtitle').textContent='只模拟输入准备，不读取文件、不执行上传。';break;case'create-case':if(!state.fixture)return;const nid='SYNTH-CASE-'+String(state.cases.length+1);state.cases.unshift({id:nid,input:'READY',analysis:'unknown',time:'当前模拟时刻',date:'模拟日 B',note:'合成几何切片',task:null});state.scenario='normal';document.getElementById('previewState').value='normal';closeDialog('create');go('case',nid);toast('示例病例已创建；未上传文件、未开始真实推理。');break;case'close-dialog':closeDialog(b.dataset.dialog);break;case'command':showDialog('command');break;case'theme':state.theme=document.body.dataset.theme==='dark'?'light':'dark';render();break;case'set-theme':state.theme=b.dataset.value;render();break;case'density':state.density=state.density==='standard'?'compact':'standard';render();toast('已切换列表密度');break;case'set-density':state.density=b.dataset.value;render();break;case'logout':go('login');break;case'help':toast('离线设计原型：可浏览页面、切换状态、模拟病例与任务；不连接服务器。');break;case'refresh':toast('原型已刷新显示；不会请求真实服务。');break;case'recover':state.scenario='normal';document.getElementById('previewState').value='normal';render();toast('已返回正常示例');break;case'metric-filter':state.filter=b.dataset.filter;go('cases');break;case'clear-filter':state.search='';state.filter='all';render();document.getElementById('caseSearch')?.focus();break;case'task-filter':state.taskFilter=b.dataset.value;render();break;case'open-nav':document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('visible');document.querySelector('.main-shell').inert=true;document.querySelector('.sidebar-close').focus();break;case'close-nav':closeNavigation();document.querySelector('.mobile-menu')?.focus();break;case'scale':state.scale=Number(b.dataset.value);render();break;case'layer':state.layer=b.dataset.value;render();toast('已切换图层选项；测试图仅示意，不代表真实响应');break;case'pointer':toast('生产版复用现有 Cornerstone 平移工具；原型不实现影像坐标运算。');break;case'zoom-in':state.zoom=Math.min(1.8,state.zoom+.15);updateViewport();break;case'zoom-out':state.zoom=Math.max(.65,state.zoom-.15);updateViewport();break;case'reset-view':state.zoom=1;state.opacity=50;state.overlay=true;render();break;case'copy-id':if(navigator.clipboard)navigator.clipboard.writeText(id).then(()=>toast('已复制示例 ID')).catch(()=>toast(id));else toast(id);break;case'retry':state.retryTarget=id;showDialog('confirm');break;case'request-analysis':state.retryTarget=id;showDialog('confirm');break;case'confirm-retry':{const c=caseById(state.retryTarget);if(!c)return;if(c.task){(state.jobHistory[c.id]??=[]).push({id:c.task,analysis:c.analysis})}c.analysis='queued';c.task='SYNTH-RETRY-'+String(++syntheticJobSequence);closeDialog('confirm');render();toast('新的示例任务已建立；原 FAILED 任务仍保留在历史记录中。');break}case'add-input':{const c=caseById(id);c.input='READY';c.note='合成几何切片';render();toast('示例输入已准备，未读取真实DICOM。');break}}});
document.addEventListener('input',e=>{if(e.target.id==='caseSearch'){state.search=e.target.value;const pos=e.target.selectionStart;document.getElementById('main').innerHTML=casePage();const i=document.getElementById('caseSearch');i.focus();try{i.setSelectionRange(pos,pos)}catch{}}if(e.target.id==='commandQuery')renderCommands(e.target.value);if(e.target.id==='opacity'){state.opacity=Number(e.target.value);document.getElementById('opacityValue').textContent=state.opacity+'%';updateViewport()}});
document.addEventListener('change',e=>{switch(e.target.id){case'previewRole':state.role=e.target.value;render();break;case'previewCapability':state.capability=e.target.value;render();break;case'previewState':state.scenario=e.target.value;render();break;case'caseFilter':state.filter=e.target.value;render();break;case'overlayToggle':state.overlay=e.target.checked;updateViewport();break;case'reduceMotion':state.reduced=e.target.checked;applyPrefs();break}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();go('overview');toast('已进入示例工作区，未进行真实登录。')}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showDialog('command')}if(e.key==='Escape'){const wasOpen=document.getElementById('sidebar')?.classList.contains('open');closeNavigation();if(wasOpen)document.querySelector('.mobile-menu')?.focus()}const s=document.getElementById('sidebar');if(e.key==='Tab'&&s?.classList.contains('open')){const elements=[...s.querySelectorAll('a,button')].filter(el=>el.getClientRects().length);const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.theme==='system')render()});
document.getElementById('commandSearchIcon').innerHTML=icon('search');document.getElementById('uploadIcon').innerHTML=icon('upload');
render();
</script></body></html>
